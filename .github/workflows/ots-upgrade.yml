name: OpenTimestamps receipt upgrade and verify

on:
  push:
    branches:
      - repro-kit-v1
    paths:
      - .github/workflows/ots-upgrade.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANONICAL_ROOT_SHA256: a914938b852e6c0afd54b103e020a774a881f52e984932d4f537ef677189d194
      ORIGINAL_OTS_SHA256: b24e9512a678484aebe971aa2801a73f9b985af7eb72911355d77e774f9441fb
      OTS_BASE64: 
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install isolated OpenTimestamps client
        run: |
          set -euo pipefail
          mkdir ots-work evidence
          cd ots-work
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund opentimestamps@0.4.9

      - name: Restore exact receipt and verify original identity
        run: |
          set -euo pipefail
          printf '%s' "$OTS_BASE64" | base64 -d > ots-work/CANONICAL_ROOT.sha256.ots
          ACTUAL="$(sha256sum ots-work/CANONICAL_ROOT.sha256.ots | awk '{print $1}')"
          test "$ACTUAL" = "$ORIGINAL_OTS_SHA256"
          printf '%s  %s\n' "$ACTUAL" CANONICAL_ROOT.sha256.ots > evidence/original-proof.sha256

      - name: Attempt receipt upgrade
        run: |
          set +e
          cd ots-work
          ./node_modules/.bin/ots-cli.js upgrade CANONICAL_ROOT.sha256.ots > ../evidence/upgrade.txt 2>&1
          RC=$?
          set -e
          echo "$RC" > ../evidence/upgrade-exit-code.txt
          ./node_modules/.bin/ots-cli.js info CANONICAL_ROOT.sha256.ots | tee ../evidence/info-after.txt
          cp CANONICAL_ROOT.sha256.ots ../evidence/CANONICAL_ROOT.sha256.ots
          sha256sum ../evidence/CANONICAL_ROOT.sha256.ots > ../evidence/upgraded-proof.sha256

      - name: Classify and independently verify if Bitcoin attested
        run: |
          set -euo pipefail
          cd ots-work
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const OpenTimestamps = require('opentimestamps');
          (async () => {
            const digest = process.env.CANONICAL_ROOT_SHA256;
            const proofBytes = fs.readFileSync('CANONICAL_ROOT.sha256.ots');
            const detachedOts = OpenTimestamps.DetachedTimestampFile.deserialize(proofBytes);
            if (Buffer.from(detachedOts.fileDigest()).toString('hex') !== digest) throw new Error('embedded digest mismatch');
            const info = fs.readFileSync('../evidence/info-after.txt','utf8');
            const hasBitcoin = info.includes('BitcoinBlockHeaderAttestation');
            let verifyResult = null;
            let verifyError = null;
            if (hasBitcoin) {
              const original = OpenTimestamps.DetachedTimestampFile.fromHash(new OpenTimestamps.Ops.OpSHA256(), Buffer.from(digest,'hex'));
              try {
                verifyResult = await OpenTimestamps.verify(detachedOts, original, {ignoreBitcoinNode:true, timeout:10000});
              } catch (e) {
                verifyError = e && e.message ? e.message : String(e);
              }
            }
            const out = {
              schema: 'MC_F40_OPENTIMESTAMPS_UPGRADE_VERIFY_V1',
              canonical_root_sha256: digest,
              embedded_digest_match: true,
              status: hasBitcoin ? (verifyResult && verifyResult.bitcoin ? 'BITCOIN_ATTESTED_VERIFIED_REMOTE' : 'BITCOIN_ATTESTED_VERIFY_HOLD') : 'PENDING_CALENDAR',
              bitcoin: verifyResult && verifyResult.bitcoin ? verifyResult.bitcoin : null,
              verify_error: verifyError,
              ots_proof_sha256: crypto.createHash('sha256').update(proofBytes).digest('hex'),
              ots_proof_bytes: proofBytes.length,
              github_run_id: process.env.GITHUB_RUN_ID,
              github_sha: process.env.GITHUB_SHA
            };
            fs.writeFileSync('../evidence/upgrade-verify-receipt.json', JSON.stringify(out, null, 2) + '\n');
            console.log(JSON.stringify(out));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-f40-opentimestamps-upgrade
          path: evidence/
          if-no-files-found: error
          retention-days: 90
